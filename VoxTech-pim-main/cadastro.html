<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxTech - Cadastro</title>

    <!-- Fonte de ícones e estilos comuns do site -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Cabeçalho com logo, pesquisa e navegação de retorno à página inicial -->
    <header class="header">

        <a href="index.html" class="logo">
            Vox<span>Tech</span>
        </a>

        <div class="search-bar">
            <input type="text" placeholder="Busque aqui...">
            <button>
                <i class="fas fa-search"></i>
            </button>
        </div>

        <div class="header-icons">
            <a href="index.html" style="color: inherit;">
                <i class="fas fa-home" title="Voltar para Home"></i>
            </a>
        </div>

    </header>

    <!-- Conteúdo principal com formulário de cadastro de usuário -->
    <main class="auth-wrapper">

        <div class="auth-card large">

            <h2 class="auth-title">Criar minha conta</h2>

            <!-- Formulário de cadastro com campos obrigatórios de usuário -->
            <form id="cadastro-form">

                <div class="form-row">

                    <div class="form-group">

                        <label>Nome*</label>

                        <input
                            type="text"
                            id="nome"
                            required>

                    </div>

                    <div class="form-group">

                        <label>Sobrenome*</label>

                        <input
                            type="text"
                            id="sobrenome"
                            required>

                    </div>

                </div>

                <div class="form-group">

                    <label>CPF*</label>

                    <input
                        type="text"
                        id="cpf"
                        required
                        placeholder="000.000.000-00">

                </div>

                <div class="form-group">

                    <label>Email*</label>

                    <input
                        type="email"
                        id="email"
                        required>

                </div>

                <div class="form-group">

                    <label>Senha*</label>

                    <input
                        type="password"
                        id="senha"
                        required>

                </div>

                <div class="form-group">

                    <label>Confirme sua senha*</label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn-primary"
                    style="margin-top: 20px; width: 50%; margin-left: 25%;">

                    Confirmar

                </button>

            </form>

        </div>

    </main>

    <!-- Rodapé com informações institucionais e rede sociais -->
    <footer class="footer">

        <div class="footer-container">

            <div class="footer-column">

                <h3>Vox<span>Tech</span></h3>

                <p>
                    A sua loja definitiva de hardware e periféricos de alta performance.
                    Desenvolvido para gamers e profissionais exigentes.
                </p>

                <div class="footer-socials">

                    <a href="#">
                        <i class="fab fa-instagram"></i>
                    </a>

                    <a href="#">
                        <i class="fab fa-linkedin"></i>
                    </a>

                    <a href="#">
                        <i class="fab fa-github"></i>
                    </a>

                    <a href="#">
                        <i class="fab fa-youtube"></i>
                    </a>

                </div>

            </div>

        </div>

        <div class="footer-bottom">

            <p>
                &copy; 2026 VoxTech Eletrônicos Ltda.
                Todos os direitos reservados.
                Projeto Acadêmico UNIP (PIM).
            </p>

        </div>

    </footer>

    <script src="script.js"></script>

</body>
</html>
